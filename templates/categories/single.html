{% extends "base.html" %}
{% block content %}
    <h1>{{ term.name }} 목록</h1>
    <ul class="entry-list">
        {% for page in term.pages %}
            <li>
                <a href="{{ page.permalink | safe }}">{{ page.title }}</a>
                <time datetime="{{ page.date }}">{{ page.date }}</time>
            </li>
        {% endfor %}
    </ul>
{% endblock content %}
