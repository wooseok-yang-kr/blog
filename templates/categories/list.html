{% extends "base.html" %}
{% block content %}
    <h1>Categories</h1>
    <ul class="entry-list">
        {% for term in terms %}
            <li>
                <a href="{{ term.permalink | safe }}">{{ term.name }}</a>
                <span>({{ term.pages | length }} pages)</span>
            </li>
        {% endfor %}
    </ul>
{% endblock content %}
